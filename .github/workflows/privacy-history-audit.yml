name: privacy-history-audit
on:
  push:
    paths: ['.github/workflows/privacy-history-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan reachable history without printing matched values
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, ipaddress, os, re, subprocess
          from collections import Counter
          patterns=[('private_key',re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----')),('openai_key',re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b')),('github_token',re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b')),('aws_access_key',re.compile(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b')),('bearer_token',re.compile(r'(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{20,}')),('password_assignment',re.compile(r'(?i)\b(?:password|passwd|pwd)\b\s*[:=]\s*["\']?([^\s"\']{4,})')),('secret_assignment',re.compile(r'(?i)\b(?:api[_-]?key|access[_-]?token|auth[_-]?token|secret[_-]?key|client[_-]?secret)\b\s*[:=]\s*["\']?([^\s"\']{8,})')),('credential_url',re.compile(r'(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@]+:[^\s/@]+@[^\s]+')),('username_assignment',re.compile(r'(?i)\b(?:username|user_name|login)\b\s*[:=]\s*["\']?([^\s"\']{2,})')),('email',re.compile(r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b')),('ipv4',re.compile(r'(?<!\d)(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?!\d)'))]
          placeholders=('example','placeholder','your_','your-','replace_me','changeme','dummy','sample','test','redacted','api_key_here','token_here','password_here','secret_here','${','<','...')
          def sev(k,v):
            l=v.lower()
            if any(x in l for x in placeholders): return 'placeholder'
            if k=='ipv4':
              try:
                ip=ipaddress.ip_address(v)
                if ip.is_loopback:return 'loopback'
                if ip.is_private:return 'private_ip'
                if ip.is_link_local:return 'link_local'
                return 'public_ip'
              except:return 'low'
            if k in {'email','username_assignment'}:return 'identity'
            return 'high'
          rows=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='ignore').splitlines(); seen=set(); out=[]
          for row in rows:
            p=row.split(' ',1); sha=p[0]; path=p[1] if len(p)>1 else '[no-path]'
            if path=='.privacy_audit/history_findings.tsv':continue
            try:t=subprocess.check_output(['git','cat-file','-t',sha],text=True,stderr=subprocess.DEVNULL).strip()
            except:continue
            if t!='blob' or sha in seen:continue
            seen.add(sha)
            try:size=int(subprocess.check_output(['git','cat-file','-s',sha],text=True).strip())
            except:continue
            if size>2000000:continue
            try:data=subprocess.check_output(['git','cat-file','-p',sha],stderr=subprocess.DEVNULL)
            except:continue
            if b'\x00' in data[:8192]:continue
            text=data.decode('utf-8',errors='ignore')
            for k,rx in patterns:
              for m in rx.finditer(text):
                v=m.group(0); line=text.count('\n',0,m.start())+1; fp=hashlib.sha256(v.encode()).hexdigest()[:16]; out.append((sev(k,v),k,sha,path,line,fp))
          out=sorted(set(out)); os.makedirs('.privacy_audit',exist_ok=True); c=Counter((x[0],x[1]) for x in out)
          with open('.privacy_audit/history_findings.tsv','w') as f:
            f.write('# raw matched values intentionally omitted\n')
            for (s,k),n in sorted(c.items()):f.write(f'# count\t{s}\t{k}\t{n}\n')
            f.write('severity\tkind\tblob_sha\tpath\tline\tfingerprint\n')
            for x in out:f.write('\t'.join(map(str,x))+'\n')
          PY
      - name: Commit redacted report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .privacy_audit/history_findings.tsv
          git diff --cached --quiet && exit 0
          git commit -m 'Add redacted privacy history audit report [skip ci]'
          git push origin HEAD:main
